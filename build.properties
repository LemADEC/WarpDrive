# is required. Look both numbers up on the CurseForge file page:
#   https://www.curseforge.com/minecraft/mc-mods/<slug>/files/<fileId>   (Project ID is in the sidebar)
# Property names map to the coordinate as:
#   *_projectid = CurseForge PROJECT id  (the "-<projectId>" part of the slug)
#   *_fileid    = CurseForge FILE id     (the ":<fileId>" version part)
